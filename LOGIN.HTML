<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Custom Knits</title>
    <link rel="stylesheet" href="LOGIN.CSS">
    <script src="LOGIN.JS" defer></script>
</head>
<body>
    <main class="contenedor">
        <a class="volver" href="INDEX.HTML">← Volver a la tienda</a>

        <section class="tarjeta">
            <div class="marca">CUSTOM <span>KNITS</span></div>
            <p class="etiqueta">BIENVENIDO DE NUEVO</p>
            <h1>Inicia sesión</h1>
            <p class="descripcion">Entra a tu cuenta y sigue descubriendo tu estilo.</p>

            <form id="formLogin">
                <label for="correo">Correo electrónico</label>
                <input id="correo" name="correo" type="email"
                    placeholder="nombre@correo.com" autocomplete="email" required>

                <label for="contrasena">Contraseña</label>
                <input id="contrasena" name="contrasena" type="password"
                    placeholder="Tu contraseña" autocomplete="current-password" required>

                <button id="btnLogin" type="submit">Iniciar sesión</button>
                <p id="mensaje" role="status" aria-live="polite"></p>
            </form>

            <p class="enlace">
                ¿Todavía no tienes cuenta?
                <a href="REGISTRO.HTML">Regístrate aquí</a>
            </p>
        </section>

        <footer>© 2026 Custom Knits · Diseñado para ti</footer>
    </main>
</body>
</html>
