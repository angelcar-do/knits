<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Custom Knits</title>
    <link rel="stylesheet" href="REGISTRO.CSS">
    <script src="REGISTRO.JS" defer></script>
</head>
<body>
    <main class="registro-contenedor">
        <a class="volver" href="INDEX.HTML">← Volver a la tienda</a>

        <section class="registro-tarjeta">
            <div class="marca">CUSTOM <span>KNITS</span></div>
            <p class="etiqueta">TU ESTILO, TU HISTORIA</p>
            <h1>Crea tu cuenta</h1>
            <p class="descripcion">
                Regístrate y descubre prendas hechas para ti.
            </p>

            <form id="formRegistro">
                <label for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre" type="text"
                    placeholder="Tu nombre" maxlength="100" required>

                <label for="correo">Correo electrónico</label>
                <input id="correo" name="correo" type="email"
                    placeholder="nombre@correo.com" maxlength="190" required>

                <label for="contrasena">Contraseña</label>
                <input id="contrasena" name="contrasena" type="password"
                    placeholder="Mínimo 8 caracteres" minlength="8"
                    autocomplete="new-password" required>

                <label for="confirmar">Confirmar contraseña</label>
                <input id="confirmar" name="confirmar" type="password"
                    placeholder="Repite tu contraseña"
                    autocomplete="new-password" required>

                <button id="btnRegistro" type="submit">Crear mi cuenta</button>
                <p id="mensaje" role="status" aria-live="polite"></p>
            </form>

            <p class="enlace-login">
                ¿Ya tienes una cuenta?
                <a href="LOGIN.HTML">Inicia sesión</a>
            </p>
        </section>

        <footer>© 2026 Custom Knits · Diseñado para ti</footer>
    </main>
</body>
</html>
